[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gitruvian"
version = "0.1.0"
description = "Assistente Git local e privado: indexa o código, chama um modelo, propõe diffs, roda testes e registra cada alteração."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Pitty" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Opcional: só necessário para GITRUVIAN_PROVIDER=anthropic.
anthropic = ["anthropic>=1.0"]

[project.scripts]
gitruvian = "gitruvian.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gitruvian"]

[tool.hatch.build.targets.sdist]
include = ["src/gitruvian", "tests", "scripts", "README.md", ".env.example", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
